version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nearme_db
      POSTGRES_USER: nearme_user
      POSTGRES_PASSWORD: nearme_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://nearme_user:nearme_password@db:5432/nearme_db
      - SECRET_KEY=your_development_secret_key_change_in_prod
      - DEBUG=True
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
